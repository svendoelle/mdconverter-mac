name: Build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: ./scripts/build_app.sh
      - name: Zip app
        run: ditto -c -k --keepParent "build/MD Converter.app" build/MDConverter.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MDConverter-macOS
          path: build/MDConverter.zip
